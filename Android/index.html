<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/runasdk.github.io/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RUNA Android SDK Documentation</title>
  <style>
    :root {
      --primary-color: #1e88e5;
      --bg-color: #f4f6f8;
      --card-bg: #fff;
      --card-radius: 8px;
      --card-shadow: rgba(0,0,0,0.1) 0px 4px 6px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg-color);
      color: #333;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      text-align: center;
      padding: 2rem 1rem;
    }
    header h1 {
      font-size: 2rem;
      color: var(--primary-color);
    }
    header p {
      margin-top: 0.5rem;
      font-size: 1rem;
      color: #555;
    }
    .cards {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 2rem;
      flex-wrap: wrap;
      padding: 1rem;
    }
    .card {
      background: var(--card-bg);
      border-radius: var(--card-radius);
      box-shadow: var(--card-shadow);
      text-decoration: none;
      color: inherit;
      width: 200px;
      padding: 2rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: rgba(0,0,0,0.15) 0px 8px 12px;
    }
    .card .icon {
      font-size: 3rem;
    }
    .card h2 {
      margin-top: 1rem;
      margin-bottom: 0.5rem;
      font-size: 1.25rem;
    }
    .card p {
      font-size: 0.9rem;
      color: #666;
      text-align: center;
    }
    footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.8rem;
      color: #999;
    }
  </style>
</head>
<body>
  <header>
    <h1>Android SDK Documentation</h1>
  </header>
</body>
</html>
